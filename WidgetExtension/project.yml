name: QuosparrWidget
options:
  bundleIdPrefix: com.quosparr.app
  deploymentTarget:
    macOS: "14.0"
targets:
  QuosparrWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ../Sources/QuosparrWidget
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: QuosparrWidget.entitlements
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1000
        ENABLE_APP_SANDBOX: YES
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: $(RUNWAY_WIDGET_BUNDLE_ID)
        PRODUCT_NAME: QuosparrWidget
        RUNWAY_APP_GROUP_ID: group.com.quosparr.app
        RUNWAY_WIDGET_DISPLAY_NAME: Quosparr
        RUNWAY_WIDGET_STORAGE_MODE: app-group
        RUNWAY_WIDGET_BUNDLE_ID: com.quosparr.app.widget
        SKIP_INSTALL: NO
        SWIFT_VERSION: "6.0"
