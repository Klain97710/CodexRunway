name: Personal migration CI

on:
  push:
    branches: [main, 'personal/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and compile without launching the desktop application
        run: |
          go test -count=1 -timeout=10m ./...
          go vet ./...
          go build ./...
          go test -race -count=1 -timeout=10m ./internal/...
          go test -tags=quosparr_dev_package -count=1 ./internal/app -run '^TestPackagedDevelopmentUpdate'
