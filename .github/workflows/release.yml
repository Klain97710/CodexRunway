name: Personal release (migration gate)

on:
  push:
    tags: ['personal-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the personal signing and acceptance pipeline
        run: |
          echo 'Migration releases are disabled until the personal release pipeline is validated.'
          exit 1
